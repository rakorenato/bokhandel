<!doctype html>
<html lang="sv" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>Bokhandel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Håll koll på dina böcker och favoritcitat.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Sätt temat direkt, innan Angular startar, så att sidan inte blinkar till i fel tema.
    (function () {
      try {
        var saved = localStorage.getItem('bokhandel.theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
